apiVersion: apps/v1
kind: Deployment
metadata:
  name: banca-core-api
  namespace: banca-prod
  labels:
    app: banca-core-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banca-core-api
  template:
    metadata:
      labels:
        app: banca-core-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: banca-core-api
          image: acrpfg1banca2026gt.azurecr.io/banca-core-api:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BANK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: banca-runtime-secret
                  key: BANK_SIGNING_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "azure-kv-banca-secrets"
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: banca-core-svc
  namespace: banca-prod
spec:
  type: ClusterIP
  selector:
    app: banca-core-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
